# The values admin@garam-dev holds. docs/architecture/configuration.md says
# which values belong to an overlay at all, and why this environment's live here
# rather than in a repository that reconciles it.

resources:
- ../../default

# The operator image this cluster runs. The tag names the commit and the digest
# names the bytes, which is the form docs/architecture/delivery.md requires.
# Advancing it is a separate act from setting the three flags below.
images:
- name: controller
  newName: 486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/gagent-operator-dev
  newTag: da07a03e1d20
  digest: sha256:9764729168e2b6a22074ee7c3832b295291fcd2555e8c34c032ab8da13dd840e

patches:
- path: manager_environment_patch.yaml
  target:
    kind: Deployment
