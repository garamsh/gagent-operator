# Three of the four flags docs/architecture/configuration.md assigns to the
# deploying overlay. The fourth, --agent-tools-image, names an image no registry
# holds yet. The base sets none of them, so an appended argument is each flag's
# only occurrence and no ordering decides which wins.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --garam-address=garam-machine.garam.svc.cluster.local:8443
# garam/gagent-agent holds a single-platform manifest and no index, so this
# digest pins linux/amd64. Every node in this cluster is linux/amd64.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --agent-image=486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/gagent-agent:0.1.0@sha256:8e8508a086a9707913c417a922e5c1da0fdb0c3267f7f3903d1a857668dce1a5
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --agent-storage-size=1Gi
