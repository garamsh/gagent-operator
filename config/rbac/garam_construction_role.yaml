# permission to construct the agents garam assigns this operator, in the
# operator's own namespace, which is where a constructed agent is built. The
# reads it makes of an Agent and of a Secret are already granted by the
# reconciler's own role, and so is an update of an Agent's status; the patch
# below is a verb of its own, and it is what reports the GRN an Agent was
# constructed from without racing the reconciler for the object's version.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: gagent-operator
    app.kubernetes.io/managed-by: kustomize
  name: garam-construction-role
rules:
- apiGroups:
  - agent.garam.sh
  resources:
  - agents
  verbs:
  - create
- apiGroups:
  - agent.garam.sh
  resources:
  - agents/status
  verbs:
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
